<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vteam TUI prototype</title>
<style>
  :root {
    --bg: #1a1b26; --fg: #c0caf5; --gray: #565f89; --dim: #414868; --cyan: #7dcfff;
    --green: #9ece6a; --red: #f7768e; --yellow: #e0af68; --blue: #7aa2f7; --magenta: #bb9af7;
    --sel: #283457;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f0f14; display: grid; place-items: center; min-height: 100vh; font-family: ui-sans-serif, system-ui, sans-serif; color: #888; }
  .window { width: min(1100px, 96vw); height: min(680px, 90vh); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px #000a; display: flex; flex-direction: column; background: var(--bg); }
  .titlebar { height: 28px; background: #24283b; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .term { flex: 1; display: flex; flex-direction: column; font: 13px/1.45 "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--fg); min-height: 0; }
  .header, .footer { display: flex; justify-content: space-between; align-items: center; padding: 2px 10px; white-space: nowrap; }
  .header { border-bottom: 1px solid var(--dim); }
  .footer { border-top: 1px solid var(--dim); }
  .tabs { display: flex; gap: 6px; align-items: center; }
  .brand { color: var(--cyan); font-weight: bold; margin-right: 4px; }
  .tab { color: var(--gray); padding: 0 6px; cursor: pointer; user-select: none; }
  .tab:hover { color: var(--fg); }
  .tab.active { background: var(--cyan); color: var(--bg); font-weight: bold; }
  .body { flex: 1; overflow: auto; padding: 4px 10px; white-space: pre; min-height: 0; }
  .body:focus, .log:focus, .sidebar:focus { outline: none; }
  .split { flex: 1; display: flex; min-height: 0; }
  .sidebar { width: 230px; border-right: 1px solid var(--dim); padding: 4px 0; overflow: auto; flex-shrink: 0; }
  .sidebar.focused { border-right-color: var(--cyan); }
  .side-title { padding: 0 10px; font-weight: bold; color: var(--gray); }
  .focused .side-title { color: var(--cyan); }
  .agent { display: flex; justify-content: space-between; padding: 0 10px; cursor: pointer; }
  .agent:hover { background: #1f2335; }
  .agent.selected { background: var(--sel); }
  .sidebar.focused .agent.selected { background: var(--fg); color: var(--bg); }
  .sidebar.focused .agent.selected * { color: var(--bg) !important; }
  .details { margin-top: 10px; padding: 6px 10px 0; border-top: 1px solid var(--dim); white-space: pre; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane-title { padding: 0 10px; border-bottom: 1px solid var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log { flex: 1; overflow: auto; padding: 4px 10px; white-space: pre-wrap; word-break: break-all; }
  .log.nowrap { white-space: pre; word-break: normal; }
  .log-line { padding-left: 9ch; text-indent: -9ch; }
  .log-line.rule { padding-left: 0; text-indent: 0; white-space: pre; overflow: hidden; }
  .runs button, .chip { background: none; border: 1px solid var(--dim); color: var(--fg); font: inherit; padding: 0 6px; cursor: pointer; border-radius: 3px; }
  .runs button:hover, .chip:hover { border-color: var(--cyan); }
  .runs button:disabled { opacity: .35; cursor: default; }
  .section { color: var(--cyan); font-weight: bold; }
  .gray { color: var(--gray); } .dim { color: var(--dim); } .bold { font-weight: bold; }
  .green { color: var(--green); } .red { color: var(--red); } .yellow { color: var(--yellow); }
  .blue { color: var(--blue); } .magenta { color: var(--magenta); } .cyan { color: var(--cyan); }
  .key { color: var(--cyan); font-weight: bold; }
  .hint { cursor: pointer; } .hint:hover .gray { color: var(--fg); }
  .overlay { position: absolute; inset: 0; background: #0009; display: none; place-items: center; }
  .overlay.open { display: grid; }
  .help { background: var(--bg); border: 1px solid var(--cyan); padding: 12px 20px; white-space: pre; font: 13px/1.5 "JetBrains Mono", Menlo, monospace; color: var(--fg); border-radius: 4px; }
  .note { margin-top: 14px; font-size: 12px; text-align: center; }
  .note code { color: #bbb; }
</style>

  const m = Math.floor((Date.now() - ms) / 60_000);
  if (m < 1) return "<1m";
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m % 60}m` : `${m}m`;
}

function colorizeLog(line) {
  if (line.startsWith("━━")) return span("section", esc(line));
  if (line.startsWith("vteam ▸")) return span("bold", esc(line));
  if (line.startsWith("✓ ")) return span("green bold", esc(line));
  const m = /^( \d{1,2}:\d\d  )(\S)(.*)$/.exec(line);
  if (!m) return /^\s+✗/.test(line) ? span("red", esc(line)) : esc(line).replace(/^(\s+)(\S+)(\s{2,})/, `$1<span class="gray">$2</span>$3`);
  const glyphClass = { "•": "blue", "✓": "green", "✗": "red", "!": "yellow", "⚙": "yellow", "❯": "magenta" }[m[2]] ?? "";
  let rest = esc(m[3]);
  if (m[2] === "⚙") rest = rest.replace(/^(\s)(\S+)/, `$1<span class="yellow bold">$2</span>`);
  if (m[2] === "!") rest = span("yellow", rest);
  if (m[2] === "✗") rest = span("red", rest);
  return `${span("gray", m[1])}${span(glyphClass, m[2])}${rest}`;
}

function renderTabs() {
  $("tabs").innerHTML = `<span class="brand">vteam ▸</span>` +
    TABS.map((t, i) => `<span class="tab ${t === state.tab ? "active" : ""}" data-tab="${t}">${i + 1} ${t}</span>`).join("");
  $("project").innerHTML = `${span("bold", PROJECT.name)}${span("gray", " (aven)")}${span("gray", " · ")}${span("gray", "label " + PROJECT.label)}${span("gray", " · ")}${span("magenta", "⎇")} ${PROJECT.branch}`;
}

function currentRun(agent) {
  return agent.runs[state.runIndex ?? agent.runs.length - 1];
}

function renderAgents() {
  const agent = AGENTS[state.selected];
  const runIdx = state.runIndex ?? agent.runs.length - 1;
  const run = currentRun(agent);
  const isLatest = state.runIndex === null;

  const list = AGENTS.map((a, i) => {
    const glyph = a.running ? span("green", "●") : span("gray", "○");
    const when = a.running ? span("green", age(a.running.since)) : span("gray", age(a.runs.at(-1).ago));
    return `<div class="agent ${i === state.selected ? "selected" : ""}" data-agent="${i}"><span>${glyph} ${a.name}</span>${when}</div>`;
  }).join("");

  const field = (k, v) => `${span("gray", k.padEnd(7))}${v}\n`;
  let details = field("status", agent.running ? span("green", `running · pid ${agent.running.pid}`) : span("gray", "idle"));
  if (agent.model) details += field("model", agent.model);
  if (agent.input) details += field("input", agent.input);
  details += field("next", agent.next) + field("runs", String(agent.runs.length));

  const live = agent.running && isLatest && run.live ? ` · ${span("green", "● live")}` : "";
  const title = `${span("bold", agent.name)} · ${run.at} · ${span(isLatest ? "gray" : "yellow bold", `run ${runIdx + 1}/${agent.runs.length}`)} · ${state.follow ? span("green", "following") : span("yellow", "paused")}${live}`;

  $("content").className = "split";
  $("content").innerHTML = `
    <div class="sidebar ${state.focus === "sidebar" ? "focused" : ""}" id="sidebar">
      <div class="side-title">AGENTS</div>${list}
      <div class="details">${details}</div>
    </div>
    <div class="pane">
      <div class="pane-title" style="display:flex;justify-content:space-between;gap:8px">
        <span style="overflow:hidden;text-overflow:ellipsis">${title}</span>
        <span class="runs">
          <button data-act="older" ${runIdx === 0 ? "disabled" : ""}>p older</button>
          <button data-act="newer" ${isLatest ? "disabled" : ""}>newer n</button>
          <button data-act="wrap">${state.wrap ? "wrap" : "nowrap"}</button>
        </span>
      </div>
      <div class="log ${state.wrap ? "" : "nowrap"}" id="log">${run.log.map((l) => `<div class="log-line${l.startsWith("━━") ? " rule" : ""}">${colorizeLog(l) || "&nbsp;"}</div>`).join("")}</div>
    </div>`;
  const log = $("log");
  if (state.follow) log.scrollTop = log.scrollHeight;
  log.onscroll = () => {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 2;
    if (atBottom !== state.follow) { state.follow = atBottom; renderTitleOnly(); }
  };
  log.onclick = () => { if (state.focus !== "log") { state.focus = "log"; render(); } };
}

function renderTitleOnly() {
  const log = $("log"), top = log?.scrollTop;
  render();
  if (log && !state.follow) $("log").scrollTop = top;
}

function renderInfo() {
  const f = (k, v) => `  ${span("gray", k.padEnd(14))}${v}\n`;
  const sec = (t) => `${span("section", ("━━ " + t + " ").padEnd(72, "━"))}\n`;
  let out = sec("Project") + f("name", `${PROJECT.name} ${span("gray", "(from aven tasks.project)")}`) + f("directory", PROJECT.dir) + f("branch", PROJECT.branch);
  out += "\n" + sec("vteam.config.json") + f("platform", "github") + f("baseBranch", "main") + f("worktreeDir", ".vteam-worktrees") +
    f("aven project", "vteam") + f("aven label", "vteam") + f("maxRetries", "3") + f("merge cron", "*/15 * * * *") + f("merge label", "vteam:changes-requested");
  out += "\n" + sec("Scheduler") + f("state", span("green", "running (pid 47102)"));
  out += "\n" + sec("Agents");
  for (const a of AGENTS) {
    out += `  ${a.running ? span("green", "●") : span("gray", "○")} ${span("bold", a.name)}\n`;
    const d = (k, v) => `      ${span("gray", k.padEnd(10))}${v}\n`;
    if (a.builtin) { out += d("", span("gray", "built-in sweep (vteam ensure-merge)")); continue; }
    out += d("model", a.model) + d("io", `${span("gray", "in")} ${a.input ?? span("dim", "—")}  ${span("gray", "out")} ${a.output}`) +
      d("cron", `${a.cron}  ${span("gray", "next " + a.next)}`) +
      d("flags", Object.entries(a.flags).map(([k, on]) => span(on ? "green" : "dim", k)).join(" "));
    if (a.filter) out += d("filter", span("gray", esc(JSON.stringify(a.filter))));
  }
  $("content").className = "split";
  $("content").innerHTML = `<div class="body" id="scroll" tabindex="0">${out}</div>`;
}

function renderOverview() {
  $("content").className = "split";
  $("content").innerHTML = `<div class="body" id="scroll" tabindex="0">${OVERVIEW()}</div>`;
}

function hints() {
  const h = (k, l, act) => `<span class="hint" ${act ? `data-act="${act}"` : ""}>${span("key", k)} ${span("gray", l)}</span>`;
  const global = [h("1-3", "tabs"), h("?", "help", "help"), h("q", "quit")];
  if (state.tab === "Agents") {
    const focus = state.focus === "sidebar" ? [h("j/k", "select"), h("l/⏎", "open log")] : [h("j/k", "scroll"), h("h", "agents"), h("G", "follow")];
    return [...focus, h("p/n", "prev/next run"), h("w", "wrap", "wrap"), ...global].join("  ");
  }
  return [h("j/k", "scroll"), h("gg/G", "top/bottom"), h("r", "refresh"), ...global].join("  ");
}

function render() {
  renderTabs();
  ({ Overview: renderOverview, Agents: renderAgents, Info: renderInfo })[state.tab]();
  $("hints").innerHTML = hints();
  const running = AGENTS.filter((a) => a.running).length;
  $("status").innerHTML = state.tab === "Overview"
    ? span("gray", "updated " + new Date().toLocaleTimeString([], { hourCycle: "h23" }))
    : running ? span("green", `● ${running} running`) : span("gray", "○ idle");
  $("overlay").classList.toggle("open", state.help);
}

$("help").innerHTML = [
  ["Global", [["1 2 3", "jump to Overview / Agents / Info"], ["Tab  S-Tab", "next / previous tab"], ["r", "refresh now"], ["?", "toggle this help"], ["q", "quit"]]],
  ["Scrolling", [["j k  ↓ ↑", "line down / up"], ["Ctrl-d Ctrl-u", "half page down / up"], ["gg  G", "top / bottom"]]],
  ["Agents tab", [["j k", "select agent (sidebar) or scroll log"], ["l  Enter  →", "focus the log"], ["h  Esc  ←", "back to the sidebar"], ["p  n", "previous (older) / next (newer) run"], ["f", "toggle follow"], ["w", "toggle line wrap"]]],
].map(([g, keys]) => `${span("section", ("━━ " + g + " ").padEnd(50, "━"))}\n` + keys.map(([k, l]) => `  ${span("key", k.padEnd(16))}${l}`).join("\n")).join("\n\n") +
  `\n\n${span("gray", "press ? or Esc to close")}`;

function selectAgent(i) {
  state.selected = Math.max(0, Math.min(i, AGENTS.length - 1));
  state.runIndex = null;
  state.follow = true;
  render();
}

function stepRun(dir) {
  const runs = AGENTS[state.selected].runs.length;
  const idx = (state.runIndex ?? runs - 1) + dir;
  if (idx < 0) return;
  state.runIndex = idx >= runs - 1 ? null : idx;
  state.follow = true;
  render();
}

document.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; return render(); }
  const agent = e.target.closest("[data-agent]");
  if (agent) { state.focus = "sidebar"; return selectAgent(Number(agent.dataset.agent)); }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "older") stepRun(-1);
  if (act === "newer") stepRun(1);
  if (act === "wrap") { state.wrap = !state.wrap; render(); }
  if (act === "help") { state.help = true; render(); }
  if (e.target.id === "overlay") { state.help = false; render(); }
});

function scroller() {
  return state.tab === "Agents" ? $("log") : $("scroll");
}

function scrollBy(px) {
  const el = scroller();
  el.scrollTop += px;
  if (state.tab === "Agents") {
    state.follow = el.scrollTop + el.clientHeight >= el.scrollHeight - 2;
    renderTitleOnly();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.altKey) return;
  const k = e.ctrlKey ? `C-${e.key}` : e.key;
  const pendingG = state.pendingG;
  state.pendingG = false;
  const line = 19, half = () => scroller().clientHeight / 2;

  if (k === "?") { state.help = !state.help; return render(); }
  if (state.help) { if (k === "Escape" || k === "q") { state.help = false; render(); } return; }
  if (["1", "2", "3"].includes(k)) { state.tab = TABS[Number(k) - 1]; return render(); }
  if (k === "Tab") { e.preventDefault(); state.tab = TABS[(TABS.indexOf(state.tab) + (e.shiftKey ? 2 : 1)) % 3]; return render(); }
  if (k === "r") return render();
  if (k === "q") { document.body.innerHTML = `<pre style="color:#888;font:14px Menlo">vteam tui exited. reload to start again.</pre>`; return; }

  if (state.tab === "Agents") {
    if (k === "w") { state.wrap = !state.wrap; return render(); }
    if (k === "f") { state.follow = !state.follow; return render(); }
    if (k === "p") return stepRun(-1);
    if (k === "n") return stepRun(1);
    if (state.focus === "sidebar") {
      if (k === "j" || k === "ArrowDown") { e.preventDefault(); return selectAgent(state.selected + 1); }
      if (k === "k" || k === "ArrowUp") { e.preventDefault(); return selectAgent(state.selected - 1); }
      if (k === "G") return selectAgent(AGENTS.length - 1);
      if (k === "g") { if (pendingG) return selectAgent(0); state.pendingG = true; return; }
      if (k === "l" || k === "Enter" || k === "ArrowRight") { state.focus = "log"; return render(); }
    } else if (k === "h" || k === "Escape" || k === "ArrowLeft") { state.focus = "sidebar"; return render(); }
  }

  if (k === "j" || k === "ArrowDown") { e.preventDefault(); scrollBy(line); }
  else if (k === "k" || k === "ArrowUp") { e.preventDefault(); scrollBy(-line); }
  else if (k === "C-d" || k === "PageDown") { e.preventDefault(); scrollBy(half()); }
  else if (k === "C-u" || k === "PageUp") { e.preventDefault(); scrollBy(-half()); }
  else if (k === "G") { scrollBy(1e6); if (state.tab === "Agents") { state.follow = true; render(); } }
  else if (k === "g") { if (pendingG) scrollBy(-1e6); else state.pendingG = true; }
});

render();

const coder = AGENTS[0];
const liveSteps = [
  " 01:27  ✓ lint passed",
  "",
  " 01:28  ✓ claude exited 0 · 1m28s · 14 turns · $0.41",
  "",
  "━━ Result ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━",
  " 01:29  ✓ committed: make lock staleness depend on the holder pid",
  " 01:32  ✓ pushed vteam/agent-lock-treated-as-stale-k3f9",
  " 01:35  ✓ PR https://github.com/example/vteam/pull/43",
  " 01:35  ✓ VTM-7KQ9 → done",
  "",
  "✓ coder completed in 1m36s",
];
const timer = setInterval(() => {
  const next = liveSteps.shift();
  if (next === undefined) { coder.running = null; coder.runs.at(-1).live = false; clearInterval(timer); }
  else coder.runs.at(-1).log.push(next);
  if (state.tab === "Agents" && state.selected === 0 && state.runIndex === null) renderTitleOnly();
  else if (state.tab !== "Agents") render();
}, 2500);
</script>
</body>
