version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, misspell, unparam]
formatters:
  enable:
    - gofmt
